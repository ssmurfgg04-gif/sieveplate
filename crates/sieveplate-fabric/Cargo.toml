[package]
name = "sieveplate-fabric"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "L6: asynchronous dataflow orchestration — promise pipelining, declarative routes, framed TCP transport"

[dependencies]
sieveplate-core.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
# hkdf 0.13 sits on digest 0.11 — sha2 must match (0.10 would be a
# different, incompatible Sha256 type)
sha2 = "0.11"
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
x25519-dalek.workspace = true
ed25519-dalek.workspace = true
ml-kem.workspace = true
ml-dsa.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
zeroize.workspace = true
getrandom.workspace = true
hex.workspace = true
# GitHub issue-comment bus: links between hosts with no inbound ports
# (CI runners behind NAT). Blocking HTTP, driven from tokio via
# spawn_blocking.
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
base64.workspace = true
