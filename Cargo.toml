[workspace]
resolver = "2"
members = ["crates/sieveplate-store", "crates/sieveplate-core", "crates/sieveplate-cells", "crates/sieveplate-fabric", "crates/sieveplate-engine", "crates/sieveplate-senses", "crates/sieveplate-sysdef", "crates/sieveplate-hearth", "crates/sieveplate-jail", "crates/sieveplate-microvm", "crates/sieveplate-ctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Sieveplate Engineers"]
repository = "https://github.com/ssmurfgg04-gif/sieveplate"
homepage = "https://github.com/ssmurfgg04-gif/sieveplate"
description = "Sieveplate: a living cell-grid runtime where signals flow through capability-gated channels"

[workspace.dependencies]
# internal
sieveplate-store   = { path = "crates/sieveplate-store" }
sieveplate-core    = { path = "crates/sieveplate-core" }
sieveplate-cells   = { path = "crates/sieveplate-cells" }
sieveplate-fabric  = { path = "crates/sieveplate-fabric" }
sieveplate-engine  = { path = "crates/sieveplate-engine" }
sieveplate-senses  = { path = "crates/sieveplate-senses" }
sieveplate-sysdef  = { path = "crates/sieveplate-sysdef" }
sieveplate-hearth  = { path = "crates/sieveplate-hearth" }
sieveplate-jail    = { path = "crates/sieveplate-jail" }
sieveplate-microvm = { path = "crates/sieveplate-microvm" }

# external
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
bincode            = "1.3"
tokio              = { version = "1", features = ["full"] }
tokio-util         = "0.7"
sha2               = "0.10"
hex                = "0.4"
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait        = "0.1"
futures            = "0.3"
toml               = "0.8"
clap               = { version = "4", features = ["derive"] }
inotify            = "0.11"

# crypto — secure host-to-host links (ADR-0004: hybrid post-quantum)
x25519-dalek       = { version = "3", features = ["getrandom"] }
ed25519-dalek      = "3"
ml-kem             = "0.3"
ml-dsa             = "0.1"
chacha20poly1305   = "0.11"
hkdf               = "0.13"
hmac               = "0.13"
zeroize            = "1"
getrandom          = "0.4"

# kernel-enforced sandboxing for process cells (ADR-0005)
seccompiler        = "0.5"
landlock           = "0.4"
libc               = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
