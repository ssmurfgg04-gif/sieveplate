name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Vertical slice smoke (release)
        run: |
          cargo build --release -p sieveplate-ctl
          ./target/release/sieve demo --quiet

      - name: Declarative system smoke
        run: |
          ./target/release/sieve apply -f examples/system.toml --root ./runtime
          ./target/release/sieve plan -f examples/system.toml --root ./runtime
          ./target/release/sieve status --root ./runtime
          ./target/release/sieve store verify --root ./runtime

      - name: Hearth smoke (snapshot → branch → diff → ddiff → rebuild)
        run: |
          R=./hearth-smoke
          ./target/release/sieve hearth write hello --text "world v1" --root $R
          H1=$(./target/release/sieve hearth write hello --text "world v1" --root $R | cut -f2)
          H2=$(./target/release/sieve hearth write hello --text "world v2 with a longer tail" --root $R | cut -f2)
          T1=$(./target/release/sieve hearth snapshot main hello=$H1 --message "v1" --root $R | grep ^tree | cut -f2)
          T2=$(./target/release/sieve hearth snapshot main hello=$H2 --message "v2" --root $R | grep ^tree | cut -f2)
          ./target/release/sieve hearth branches --root $R
          ./target/release/sieve hearth log main --root $R
          D=$(./target/release/sieve hearth ddiff $T1 $T2 --root $R | grep ^delta | cut -f2)
          ./target/release/sieve hearth apply-delta $T1 $D --root $R | grep -q "$T2"
          echo "hearth: ddiff round-trip verified ($T1 → $T2 via $D)"

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # seccomp works unprivileged; these spawn REAL jailed worker
      # processes and assert socket()/open() denial inside them.
      - name: Process-cell (jail) + adversarial suite
        run: cargo test -p sieveplate-ctl --test jail --test adversarial

  ebpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build senses
        run: cargo build -p sieveplate-senses

      # The real bpf(2) load + attach + packet event test needs root.
      - name: eBPF load/attach test (as root)
        run: sudo -E $(which cargo) test -p sieveplate-senses -- --ignored --nocapture

  sel4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Actually BUILD a seL4 (Microkit) system and BOOT it under QEMU.
      - name: Install QEMU + LLVM toolchain (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm clang lld

      - name: Install Microkit SDK
        run: |
          wget -q https://github.com/seL4/microkit/releases/download/2.3.1/microkit-sdk-2.3.1-linux-x86-64.tar.gz
          tar xf microkit-sdk-2.3.1-linux-x86-64.tar.gz
          echo "MICROKIT_SDK=$PWD/microkit-sdk" >> $GITHUB_ENV

      - name: Build seL4 system (qemu_virt_aarch64)
        working-directory: platforms/sel4
        run: |
          chmod +x build.sh
          ./build.sh "$MICROKIT_SDK" qemu_virt_aarch64

      - name: Boot seL4 under QEMU (smoke)
        working-directory: platforms/sel4
        run: |
          chmod +x boot-smoke.sh
          ./boot-smoke.sh

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: nix flake check
        run: nix flake check --print-build-logs
